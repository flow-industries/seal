name: publish

# Publishes on a version bump, with no token: npm authenticates the run itself through
# GitHub's OIDC provider (trusted publishing), which is what `id-token: write` mints.
# Only the publish job may mint it: the quality gate installs and runs dependency code.
# That job runs in the `npm` environment, which the trusted publisher names. Restricted to
# `main` in the repo's settings (a manual step, possible once the repo is public), it stops
# a dispatch on any other branch from publishing.
# The trusted publisher registered on npmjs.com names this file, so renaming it breaks
# publishing until the npm side is updated to match.
on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: quality
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # `prepublishOnly` builds `dist` with the repo's own TypeScript.
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # WHY: OIDC publishing needs npm 11.5.1 or newer, which is ahead of what setup-node bundles.
      - run: npm install -g npm@11.21.1
      - id: state
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "target=$name@$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.state.outputs.published == 'true'
        run: echo "${{ steps.state.outputs.target }} is already on npm; nothing to publish."
      - if: steps.state.outputs.published == 'false'
        run: npm publish
